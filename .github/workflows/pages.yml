name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  quality:
    name: Python quality (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements_dev.txt
      - name: Install development tools
        run: python -m pip install -r requirements_dev.txt
      - name: Install Python API
        run: python -m pip install .
      - name: Check Python formatting, lint and types
        run: |
          ruff format --check .
          ruff check .
          python -m mypy
          python -m pylint catalogue_config.py metadata_types.py dataset_metadata.py ingest.py refresh.py src/uk_boundaries
      - name: Test Python compatibility
        run: python -m unittest discover -s tests

  test:
    name: Catalogue and ingestion tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run ingestion tests
        run: |
          python -m pip install .
          python -m unittest discover -s tests
      - name: Run catalogue tests
        run: node --test tests/catalogue.test.mjs
      - name: Check browser JavaScript syntax
        run: node --check dist/app.js

  deploy:
    name: Publish website
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
