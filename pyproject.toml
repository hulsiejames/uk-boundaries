# Code-quality conventions adapted from caf.toolkit and cookiecutter-caf.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uk-boundary-atlas"
version = "0.1.0"
description = "Find UK geography datasets and download publisher GeoPackages or shapefiles."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
examples = ["geopandas>=1.1,<2", "pyogrio>=0.11,<1"]

[project.urls]
Homepage = "https://hulsiejames.github.io/uk-boundaries/"
Repository = "https://github.com/hulsiejames/uk-boundaries"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uk_boundaries = ["py.typed"]

[tool.ruff]
line-length = 95
target-version = "py310"
extend-exclude = ["work", ".venv", ".conda", "build"]

[tool.ruff.lint]
select = ["A", "E", "W", "F", "UP", "B", "I", "N", "D", "ANN", "RUF", "PGH"]

[tool.ruff.lint.per-file-ignores]
# unittest hooks have prescribed names; test names describe the scenarios.
"tests/*.py" = ["D", "ANN", "N802"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
files = ["catalogue_config.py", "metadata_types.py", "dataset_metadata.py", "ingest.py", "refresh.py", "refresh_notify.py", "src/uk_boundaries"]
strict = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["geopandas", "geopandas.*"]
# GeoPandas does not ship typing metadata; the optional example remains annotated.
ignore_missing_imports = true

[tool.pylint.main]
py-version = "3.10"

[tool.pylint.design]
max-args = 10
max-positional-arguments = 7
max-statements = 100
max-locals = 25
max-attributes = 15
max-branches = 15
max-returns = 8
max-bool-expr = 6

[tool.pylint.messages_control]
# Ruff owns formatting/import order; dict() mirrors the publisher's JSON keys.
disable = ["line-too-long", "wrong-import-order", "ungrouped-imports", "use-dict-literal"]

[tool.pylint.reports]
score = false
